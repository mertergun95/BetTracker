name: Deploy web app to GitHub Pages

on:
  push:
    # This repository was created empty, so its first pushed branch became the
    # default one and no `main` exists. Both are listed so the site deploys
    # today and keeps deploying if `main` is created later.
    branches:
      - main
      - claude/repository-ekleme-gz6um0
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        # The site is served from https://<user>.github.io/<repo>/, so the base
        # path must match the repository name. Deriving it from the checkout
        # keeps a renamed or forked repo working without editing the config.
        run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
