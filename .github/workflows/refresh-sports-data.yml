name: Refresh sports data

on:
  schedule:
    # Every day at 04:15 UTC — after North American games have finished and
    # before European fixtures are usually rescheduled.
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch leagues, teams and fixtures
        run: npm run fetch:sports

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- public/data; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Refresh sports data"
          git push
